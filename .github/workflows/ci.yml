name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# 同一 ref の後続 push で先行 run を打ち切る。main / develop への push は
# 各コミットの検証記録を残すため打ち切らない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SOLUTION_PATH: "winui3/SquirrelNotifier.WinUI3.sln"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-and-test:
    runs-on: windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: ./.github/actions/dotnet-setup

      - name: Install dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      # analyzer 設定は csproj 側（EnableNETAnalyzers / AnalysisMode / EnforceCodeStyleInBuild）に
      # あるため、警告をエラー扱いにする指定を本ビルドへ集約し、同一構成の再ビルドは行わない。
      - name: Build solution
        run: >
          dotnet build ${{ env.SOLUTION_PATH }}
          --configuration Release
          --no-restore
          /p:Platform=x64
          /p:IncludeWindowsSdkBuildTools=false
          /p:TreatWarningsAsErrors=true
          /p:RunCodeAnalysis=true

      - name: Verify MSI MajorUpgrade
        shell: pwsh
        run: |
          $payloadDir = (New-Item -ItemType Directory -Path "./installer-test-payload" -Force).FullName
          New-Item -ItemType File -Path (Join-Path $payloadDir "SquirrelNotifier.WinUI3.exe") -Force | Out-Null
          $outputDir = (New-Item -ItemType Directory -Path "./installer-test-output" -Force).FullName
          dotnet build winui3/SquirrelNotifier.Installer/SquirrelNotifier.Installer.wixproj `
            --configuration Release `
            /p:Platform=x64 `
            /p:HarvestPath="$payloadDir" `
            /p:PackageVersion=1.2.3 `
            /p:OutputPath="$outputDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi = Get-ChildItem -Path $outputDir -Filter "*.msi" -Recurse | Select-Object -First 1
          if (-not $msi) { throw "検証用 MSI が見つかりません: $outputDir" }
          ./scripts/test-msi-major-upgrade.ps1 -MsiPath $msi.FullName

      # coverlet は ThresholdType へ複数種別を同時指定できるため、line / branch / method を
      # 1 回の test 実行でまとめて判定する（従来は種別ごとに 3 回実行していた）。
      # 区切りのカンマは MSBuild がプロパティ区切りとして解釈するため %2c でエスケープする。
      - name: Run tests with coverage
        run: |
          dotnet test ${{ env.SOLUTION_PATH }} `
            --configuration Release `
            --no-build `
            --verbosity normal `
            --collect:"XPlat Code Coverage" `
            --results-directory ./coverage `
            /p:CollectCoverage=true `
            /p:CoverletOutputFormat=opencover `
            /p:ThresholdType=line%2cbranch%2cmethod `
            /p:Threshold=80

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          directory: ./coverage
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          name: codecov-umbrella

  lint:
    runs-on: windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: ./.github/actions/dotnet-setup

      # dotnet-format グローバルツールは .NET 5 時代の非推奨パッケージで、導入すると
      # SDK 組み込みの dotnet format を隠してしまう。lefthook の pre-commit と同じ
      # SDK 組み込み版を使う。
      - name: Run dotnet format
        run: dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes

  security-scan:
    runs-on: windows-2025
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: ./.github/actions/dotnet-setup

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: Restore for CodeQL
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Prepare WinRT generator output folders
        run: |
          $base = Join-Path "winui3/SquirrelNotifier.WinUI3" "obj/x64/Release/net10.0-windows10.0.26100.0/generated/WinRT.SourceGenerator/Generator.WinRTAotSourceGenerator"
          New-Item -ItemType Directory -Force -Path $base | Out-Null

      - name: Build for CodeQL
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore /p:Platform=x64 /p:IncludeWindowsSdkBuildTools=false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      # TEMP(#220): build-mode 比較のための計測。比較確定後に削除する。
      - name: Report CodeQL extraction
        if: always()
        shell: pwsh
        run: ./scripts/report-codeql-extraction.ps1 -Language csharp

  # #220: 壁時計の変化を継続的に追えるよう、job / step の所要時間を job summary へ残す。
  timing-report:
    needs: [build-and-test, lint, security-scan]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Report CI durations
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/report-ci-timings.ps1 `
            -Repository "${{ github.repository }}" `
            -RunId "${{ github.run_id }}" `
            -RunAttempt ${{ github.run_attempt }}
