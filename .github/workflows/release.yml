name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-package:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Get version
        id: version
        shell: pwsh
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:RELEASE_INPUT_VERSION
          }
          else {
            $version = $env:RELEASE_REF_NAME
          }
          $version = $version -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "version が SemVer の 3 要素形式ではありません: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Install WiX 7
        shell: pwsh
        run: .\scripts\Ensure-Wix.ps1 -Version 7.0.0

      - name: Build release package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          .\scripts\Build-ReleasePackage.ps1
          -Version $env:RELEASE_VERSION
          -OutputDirectory .\release-output

      - name: Upload release package for desktop gate
        uses: actions/upload-artifact@v7
        with:
          name: release-payload-x64
          path: |
            release-output/*.zip
            release-output/*.msi
            release-output/checksums-x64.txt
            release-output/release-package.json
          if-no-files-found: error
          retention-days: 7

  # TEMPORARY: DesktopFull の実行前提（DESKTOP_E2E_GATEWAY_URL 等の secret と
  # mcp-docker / mcp-gateway / thread-owl / mcp-resource-subscriber の外部 component stack）
  # が未整備で、gate は導入以来一度も成功していない。v0.13.1 を出すため一時的に無効化する。
  # publish はこの job の結果に依存しない状態へ戻すこと。復帰は #381 で追跡する。
  desktop-e2e:
    needs: build-package
    if: false
    uses: ./.github/workflows/desktop-e2e.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      release_artifact_name: release-payload-x64
      expected_version: ${{ needs.build-package.outputs.version }}
      scenario: DesktopFull
      artifact_retention_days: 90
    secrets: inherit

  publish:
    needs: build-package
    # TEMPORARY: desktop E2E gate の無効化に伴い、desktop-e2e への依存を外している（#381）。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release package
        uses: actions/download-artifact@v7
        with:
          name: release-payload-x64
          path: release-output

      - name: Compose release notes from CHANGELOG
        shell: pwsh
        env:
          VERSION: ${{ needs.build-package.outputs.version }}
        run: .\scripts\extract-release-notes.ps1 -Version $env:VERSION

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-output/*.zip
            release-output/*.msi
            release-output/checksums-x64.txt
          draft: false
          prerelease: false
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release package artifact
        uses: actions/upload-artifact@v7
        with:
          name: SquirrelNotifier-x64
          path: |
            release-output/*.zip
            release-output/*.msi
            release-output/checksums-x64.txt
          if-no-files-found: error
          retention-days: 30
