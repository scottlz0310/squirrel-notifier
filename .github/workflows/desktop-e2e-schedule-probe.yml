name: Desktop E2E Schedule Probe

# reaper の schedule が起動しない原因を切り分けるための一時的な workflow（#380）。
on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record schedule event
        run: echo 'desktop E2E schedule probe fired'
