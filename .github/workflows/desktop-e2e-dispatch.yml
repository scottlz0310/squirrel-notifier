name: Desktop E2E Dispatch

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: '検証対象コードの branch/tag。workflow 定義は main から実行する。'
        required: true
        type: string
        default: main
      expected_version:
        description: '検証対象の製品 version。空なら csproj の version を使用する。'
        required: false
        type: string
        default: ''
      scenario:
        description: '実行する desktop scenario'
        required: true
        type: choice
        options:
          - DesktopSmoke
          - DesktopFull
        default: DesktopSmoke
      artifact_retention_days:
        description: 'E2E artifact の保持日数（1〜90 の整数）'
        required: true
        type: string
        default: '14'
      runner_mode:
        description: 'persistent: 既存 instance を起動・停止する / ephemeral: Launch Template から使い捨て instance を作って terminate する（#380）'
        required: true
        type: choice
        options:
          - persistent
          - ephemeral
        default: persistent

permissions:
  contents: read
  actions: read

jobs:
  reject-untrusted-workflow-ref:
    name: Require trusted dispatcher ref
    runs-on: ubuntu-latest
    outputs:
      target_ref: ${{ steps.validate_target_ref.outputs.target_ref }}
    steps:
      - name: Reject non-main workflow ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'desktop E2E の手動実行は main ref の dispatcher から開始してください。' >&2
            echo '検証対象の branch/tag は target_ref で指定します。' >&2
            exit 1
          fi
          echo 'trusted dispatcher ref: main'

      - name: Validate target ref for scenario
        id: validate_target_ref
        env:
          SCENARIO: ${{ inputs.scenario }}
          TARGET_REF: ${{ inputs.target_ref }}
          ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact_retention_days }}
        shell: bash
        run: |
          # 呼び出し先へ fromJSON で数値として渡すため、ここで JSON の正規の数値形式かつ
          # 1〜90 であることを確定させる。不正値のままだとジョブ生成時に失敗し、
          # ログの残らない診断困難な失敗になる。
          #
          # 範囲検証に bash の算術を使わないのは、算術が入力を別の値として解釈するため。
          # 先頭 0 は 8 進数となり `014` が 12 として範囲内と誤判定され、`008` は
          # `value too great for base` で異常終了し、20 桁級の値は 64bit で桁あふれする。
          # いずれも fromJSON 側では JSON の数値として扱えず、避けたい失敗が再発する。
          # 正規形だけを受理する正規表現に一本化し、fromJSON と検証の規則を揃える。
          if [[ ! "$ARTIFACT_RETENTION_DAYS" =~ ^([1-9]|[1-8][0-9]|90)$ ]]; then
            echo 'artifact_retention_days は 1〜90 の整数で指定してください（先頭 0 は不可）。' >&2
            exit 1
          fi

          validated_target_ref="$TARGET_REF"

          if [[ "$SCENARIO" == 'DesktopFull' ]]; then
            case "$TARGET_REF" in
              main)
                validated_target_ref='refs/heads/main'
                ;;
              refs/heads/main|refs/tags/v*)
                ;;
              v*)
                validated_target_ref="refs/tags/$TARGET_REF"
                ;;
              *)
                echo 'DesktopFull は main または v* tag のみを target_ref に指定できます。feature branch は DesktopSmoke で実行してください。' >&2
                exit 1
                ;;
            esac
          fi

          echo "target_ref=$validated_target_ref" >> "$GITHUB_OUTPUT"

  build-target-package:
    name: Build target package without E2E secrets
    needs: reject-untrusted-workflow-ref
    if: needs.reject-untrusted-workflow-ref.result == 'success'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout target code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ needs.reject-untrusted-workflow-ref.outputs.target_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'

      - name: Install WiX 7
        shell: pwsh
        run: .\scripts\Ensure-Wix.ps1 -Version 7.0.0

      - name: Build target release package
        shell: pwsh
        run: .\scripts\Build-ReleasePackage.ps1 -OutputDirectory .\release-output

      - name: Upload target release package
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-target-${{ github.run_id }}
          path: |
            release-output/*.zip
            release-output/*.msi
            release-output/checksums-x64.txt
            release-output/release-package.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  desktop-e2e:
    name: Desktop E2E (${{ inputs.scenario }})
    if: needs.build-target-package.result == 'success'
    needs: build-target-package
    uses: ./.github/workflows/desktop-e2e.yml
    with:
      release_artifact_name: desktop-e2e-target-${{ github.run_id }}
      expected_version: ${{ inputs.expected_version }}
      scenario: ${{ inputs.scenario }}
      # 呼び出し先の入力は type: number。workflow_dispatch の入力は文字列として渡るため、
      # そのまま渡すとジョブ生成時に型が一致せず、ログも check-run も残さずに run が失敗する。
      artifact_retention_days: ${{ fromJSON(inputs.artifact_retention_days) }}
      runner_mode: ${{ inputs.runner_mode }}
    secrets: inherit
    permissions:
      contents: read
      actions: read
      id-token: write
