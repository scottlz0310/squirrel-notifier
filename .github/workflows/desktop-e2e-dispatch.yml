name: Desktop E2E Dispatch

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: '検証対象コードの branch/tag。workflow 定義は main から実行する。'
        required: true
        type: string
        default: main
      expected_version:
        description: '検証対象の製品 version。空なら csproj の version を使用する。'
        required: false
        type: string
        default: ''
      scenario:
        description: '実行する desktop scenario'
        required: true
        type: choice
        options:
          - DesktopSmoke
          - DesktopFull
        default: DesktopSmoke
      artifact_retention_days:
        description: 'E2E artifact の保持日数'
        required: true
        type: number
        default: 14

permissions:
  contents: read
  actions: read

jobs:
  reject-untrusted-workflow-ref:
    name: Require trusted dispatcher ref
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main workflow ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'desktop E2E の手動実行は main ref の dispatcher から開始してください。' >&2
            echo '検証対象の branch/tag は target_ref で指定します。' >&2
            exit 1
          fi
          echo 'trusted dispatcher ref: main'

  build-target-package:
    name: Build target package without E2E secrets
    needs: reject-untrusted-workflow-ref
    if: needs.reject-untrusted-workflow-ref.result == 'success'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout target code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.target_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install WiX 7
        shell: pwsh
        run: .\scripts\Ensure-Wix.ps1 -Version 7.0.0

      - name: Build target release package
        shell: pwsh
        run: .\scripts\Build-ReleasePackage.ps1 -OutputDirectory .\release-output

      - name: Upload target release package
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-target-${{ github.run_id }}
          path: |
            release-output/*.zip
            release-output/*.msi
            release-output/checksums-x64.txt
            release-output/release-package.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  desktop-e2e:
    name: Desktop E2E (${{ inputs.scenario }})
    if: needs.build-target-package.result == 'success'
    needs: build-target-package
    uses: scottlz0310/squirrel-notifier/.github/workflows/desktop-e2e.yml@main
    with:
      release_artifact_name: desktop-e2e-target-${{ github.run_id }}
      expected_version: ${{ inputs.expected_version }}
      scenario: ${{ inputs.scenario }}
      artifact_retention_days: ${{ inputs.artifact_retention_days }}
    secrets: inherit
    permissions:
      contents: read
      actions: read
      id-token: write
