name: Desktop E2E

on:
  workflow_call:
    inputs:
      release_artifact_name:
        description: 'リリース build job が作成した artifact 名。空なら runner 上で build する。'
        required: false
        type: string
        default: ''
      expected_version:
        description: '検証対象の製品 version'
        required: false
        type: string
        default: ''
      scenario:
        description: '実行する desktop scenario'
        required: false
        type: string
        default: DesktopSmoke
      artifact_retention_days:
        description: 'E2E artifact の保持日数'
        required: false
        type: number
        default: 14
      runner_mode:
        description: 'persistent は既存 instance を起動・停止する。ephemeral は Launch Template から使い捨て instance を作り、終了後に terminate する（#380）。'
        required: false
        type: string
        default: persistent
    secrets:
      DESKTOP_E2E_GATEWAY_URL:
        required: false
      DESKTOP_E2E_RESOURCE_URIS:
        required: false
      DESKTOP_E2E_COMPONENT_MANIFEST_JSON:
        required: false
      DESKTOP_E2E_GITHUB_APP_PRIVATE_KEY:
        required: false
permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-e2e-ec2
  cancel-in-progress: false

jobs:
  prepare-runner:
    name: Prepare EC2 desktop runner
    runs-on: ubuntu-latest
    # ephemeral は境界確認と、起動から runner の online まで（手動検証で約 7 分、待機上限 15 分）を含む。
    timeout-minutes: ${{ inputs.runner_mode == 'ephemeral' && 25 || 15 }}
    # environment の trusted branch/tag policy (main / v*) と trusted dispatcher により、
    # 未保護 ref の workflow 定義が秘密鍵へ到達しないようにする。
    environment: desktop-e2e
    permissions:
      contents: read
      actions: read
      id-token: write
    # ephemeral の instance_id は起動直後に書き出されるため、後続の手順で失敗しても cleanup が terminate できる。
    outputs:
      instance_id: ${{ inputs.runner_mode == 'ephemeral' && steps.ephemeral.outputs.instance_id || steps.lifecycle.outputs.instance_id }}
      started_by_workflow: ${{ steps.lifecycle.outputs.started_by_workflow }}
      runs_on: ${{ inputs.runner_mode == 'ephemeral' && format('["self-hosted","windows","{0}"]', steps.ephemeral.outputs.runner_label) || '["self-hosted","windows","squirrel-notifier-desktop"]' }}

    steps:
      - name: Validate EC2 runner configuration
        shell: bash
        env:
          RUNNER_MODE: ${{ inputs.runner_mode }}
          AWS_REGION: ${{ vars.DESKTOP_E2E_AWS_REGION }}
          AWS_ROLE_TO_ASSUME: ${{ vars.DESKTOP_E2E_AWS_ROLE_ARN }}
          INSTANCE_ID: ${{ vars.DESKTOP_E2E_AWS_INSTANCE_ID }}
          LAUNCH_TEMPLATE_ID: ${{ vars.DESKTOP_E2E_AWS_LAUNCH_TEMPLATE_ID }}
          TARGET_RUNNER_NAME: ${{ vars.DESKTOP_E2E_RUNNER_NAME }}
          GITHUB_APP_ID: ${{ vars.DESKTOP_E2E_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.DESKTOP_E2E_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          case "$RUNNER_MODE" in
            persistent|ephemeral) ;;
            *)
              echo "runner_mode は persistent か ephemeral で指定してください: $RUNNER_MODE" >&2
              exit 1
              ;;
          esac

          missing=()
          [[ -n "$AWS_REGION" ]] || missing+=(DESKTOP_E2E_AWS_REGION)
          [[ -n "$AWS_ROLE_TO_ASSUME" ]] || missing+=(DESKTOP_E2E_AWS_ROLE_ARN)
          # ephemeral でも、OIDC ロールの境界確認で永続 instance を terminate できないことの確認に使う。
          [[ -n "$INSTANCE_ID" ]] || missing+=(DESKTOP_E2E_AWS_INSTANCE_ID)
          [[ -n "$TARGET_RUNNER_NAME" ]] || missing+=(DESKTOP_E2E_RUNNER_NAME)
          [[ -n "$GITHUB_APP_ID" ]] || missing+=(DESKTOP_E2E_GITHUB_APP_ID)
          [[ -n "$GITHUB_APP_PRIVATE_KEY" ]] || missing+=(DESKTOP_E2E_GITHUB_APP_PRIVATE_KEY)
          if [[ "$RUNNER_MODE" == 'ephemeral' ]]; then
            [[ -n "$LAUNCH_TEMPLATE_ID" ]] || missing+=(DESKTOP_E2E_AWS_LAUNCH_TEMPLATE_ID)
          fi

          if (( ${#missing[@]} > 0 )); then
            printf '必要な repository variable/secret がありません: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if [[ "$INSTANCE_ID" != i-* ]]; then
            echo 'DESKTOP_E2E_AWS_INSTANCE_ID は EC2 instance ID (i-...) で指定してください。' >&2
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.DESKTOP_E2E_AWS_REGION }}
          role-to-assume: ${{ vars.DESKTOP_E2E_AWS_ROLE_ARN }}
          role-session-name: desktop-e2e-${{ github.run_id }}

      - name: Create GitHub App token
        id: github-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DESKTOP_E2E_GITHUB_APP_ID }}
          private-key: ${{ secrets.DESKTOP_E2E_GITHUB_APP_PRIVATE_KEY }}
          # ephemeral は JIT runner の発行に Administration: write が要る。永続 runner は状態の参照だけ。
          permission-administration: ${{ inputs.runner_mode == 'ephemeral' && 'write' || 'read' }}

      - name: Checkout runner lifecycle scripts
        if: inputs.runner_mode == 'ephemeral'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: scripts/aws

      # 使い捨て instance を作る前に、OIDC ロールで Launch Template の値を上書きした起動と
      # 永続 instance の terminate が拒否されることを DryRun で確かめる（fail-closed）。
      - name: Verify OIDC role boundary
        if: inputs.runner_mode == 'ephemeral'
        shell: pwsh
        env:
          AWS_REGION: ${{ vars.DESKTOP_E2E_AWS_REGION }}
          LAUNCH_TEMPLATE_ID: ${{ vars.DESKTOP_E2E_AWS_LAUNCH_TEMPLATE_ID }}
          INSTANCE_ID: ${{ vars.DESKTOP_E2E_AWS_INSTANCE_ID }}
        run: ./scripts/aws/Test-DesktopE2EOidcBoundary.ps1 -LaunchTemplateId $env:LAUNCH_TEMPLATE_ID -ReferenceInstanceId $env:INSTANCE_ID -Region $env:AWS_REGION

      - name: Launch ephemeral instance and wait for runner
        id: ephemeral
        if: inputs.runner_mode == 'ephemeral'
        shell: pwsh
        env:
          AWS_REGION: ${{ vars.DESKTOP_E2E_AWS_REGION }}
          LAUNCH_TEMPLATE_ID: ${{ vars.DESKTOP_E2E_AWS_LAUNCH_TEMPLATE_ID }}
          GH_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          ./scripts/aws/Start-DesktopEphemeralRunner.ps1 `
            -Repository $env:GITHUB_REPOSITORY `
            -LaunchTemplateId $env:LAUNCH_TEMPLATE_ID `
            -RunId $env:GITHUB_RUN_ID `
            -Region $env:AWS_REGION `
            -GitHubOutputPath $env:GITHUB_OUTPUT `
            -TempDirectory $env:RUNNER_TEMP

      - name: Start instance and wait for runner
        id: lifecycle
        if: inputs.runner_mode == 'persistent'
        shell: bash
        env:
          AWS_REGION: ${{ vars.DESKTOP_E2E_AWS_REGION }}
          INSTANCE_ID: ${{ vars.DESKTOP_E2E_AWS_INSTANCE_ID }}
          TARGET_RUNNER_NAME: ${{ vars.DESKTOP_E2E_RUNNER_NAME }}
          TARGET_RUNNER_LABEL: squirrel-notifier-desktop
          GH_TOKEN: ${{ steps.github-app-token.outputs.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo 'started_by_workflow=false' >> "$GITHUB_OUTPUT"

          state="$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)"
          echo "EC2 instance initial state: $state"

          case "$state" in
            stopped)
              aws ec2 start-instances --instance-ids "$INSTANCE_ID" >/dev/null
              echo 'started_by_workflow=true' >> "$GITHUB_OUTPUT"
              echo 'EC2 instance をこの workflow から起動しました。'
              ;;
            running)
              echo 'EC2 instance は workflow 開始前から起動していました。停止責任は取得しません。'
              ;;
            *)
              echo "EC2 instance が起動・利用可能な状態ではありません: $state" >&2
              exit 1
              ;;
          esac

          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"

          for attempt in $(seq 1 60); do
            runners="$(curl --silent --show-error --fail-with-body \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_URL/repos/$REPOSITORY/actions/runners?per_page=100")" || {
                echo "runner 一覧の取得に失敗しました。再試行します (${attempt}/60)。" >&2
                sleep 10
                continue
              }

            runner_state="$(jq -r \
              --arg runner "$TARGET_RUNNER_NAME" \
              --arg label "$TARGET_RUNNER_LABEL" \
              '.runners[]? | select(.name == $runner) | if ([.labels[]?.name] | index($label)) == null then "invalid-label" else "\(.status):\(.busy)" end' \
              <<< "$runners" | head -n 1)"

            case "$runner_state" in
              online:false)
                echo "runner が online になりました: $TARGET_RUNNER_NAME"
                {
                  echo '### EC2 desktop runner'
                  echo "- instance: \`$INSTANCE_ID\`"
                  echo "- runner: \`$TARGET_RUNNER_NAME\`"
                  echo '- runner status: online'
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              invalid-label)
                echo "runner に必要な label がありません: $TARGET_RUNNER_LABEL" >&2
                exit 1
                ;;
              online:true)
                echo "runner は online ですが busy です。再試行します (${attempt}/60)。"
                ;;
              offline:*)
                echo "runner はまだ offline です。再試行します (${attempt}/60)。"
                ;;
              '')
                echo "runner が見つかりません。再試行します (${attempt}/60)。"
                if (( attempt == 1 || attempt % 10 == 0 )); then
                  jq -r --arg runner "$TARGET_RUNNER_NAME" '"  この token から見える runner: total=\(.total_count) names=[\([.runners[]?.name] | join(", "))] / 比較名=[\($runner)]"' <<< "$runners"
                fi
                ;;
              *)
                echo "runner の状態を確認できません: $runner_state" >&2
                ;;
            esac
            sleep 10
          done

          echo "runner が online になりませんでした: $TARGET_RUNNER_NAME" >&2
          exit 1

  desktop-e2e:
    name: Windows desktop E2E (${{ inputs.scenario }})
    needs: prepare-runner
    # persistent は既存 runner のラベル、ephemeral はこの run だけの JIT runner のラベル（別の run の job を拾わない）。
    runs-on: ${{ fromJSON(needs.prepare-runner.outputs.runs_on) }}
    environment: desktop-e2e
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout trusted E2E harness
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: trusted-source

      # self-hosted runner は使い回しで workspace が run をまたいで残る。前回の MSI が残ると
      # 検証対象と別 version をインストールし、前回の scenario 証跡も artifact へ混ざる（#399）。
      - name: Reset desktop E2E outputs
        shell: pwsh
        run: |
          foreach ($path in @('release-output', 'artifacts\e2e\desktop')) {
            $fullPath = Join-Path $env:GITHUB_WORKSPACE $path
            if (Test-Path -LiteralPath $fullPath) {
              Remove-Item -LiteralPath $fullPath -Recurse -Force
            }
          }

      - name: Setup .NET
        if: inputs.release_artifact_name == ''
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'

      - name: Install WiX 7
        if: inputs.release_artifact_name == ''
        shell: pwsh
        run: .\scripts\Ensure-Wix.ps1 -Version 7.0.0

      - name: Download release package
        if: inputs.release_artifact_name != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.release_artifact_name }}
          path: release-output

      - name: Build release package on runner
        if: inputs.release_artifact_name == ''
        shell: pwsh
        run: .\trusted-source\scripts\Build-ReleasePackage.ps1 -OutputDirectory .\release-output

      - name: Measure runner storage
        shell: pwsh
        run: >-
          .\trusted-source\tests\e2e\scripts\Measure-DesktopE2EStorage.ps1
          -OutputPath "$env:GITHUB_WORKSPACE\artifacts\e2e\desktop\storage.json"
          -WorkspacePath "$env:GITHUB_WORKSPACE"

      - name: Run desktop E2E
        shell: pwsh
        env:
          DESKTOP_E2E_GATEWAY_URL: ${{ secrets.DESKTOP_E2E_GATEWAY_URL }}
          DESKTOP_E2E_RESOURCE_URIS: ${{ secrets.DESKTOP_E2E_RESOURCE_URIS }}
          DESKTOP_E2E_COMPONENT_MANIFEST_JSON: ${{ secrets.DESKTOP_E2E_COMPONENT_MANIFEST_JSON }}
          DESKTOP_E2E_COMPONENT_MANIFEST_PATH: ${{ vars.DESKTOP_E2E_COMPONENT_MANIFEST_PATH }}
          DESKTOP_E2E_FULL_DRIVER: ${{ vars.DESKTOP_E2E_FULL_DRIVER }}
          DESKTOP_E2E_EXPECTED_VERSION: ${{ inputs.expected_version }}
          DESKTOP_E2E_SCENARIO: ${{ inputs.scenario }}
        run: |
          # 複数あるときに 1 つを選ぶと、検証対象と別の MSI を黙ってインストールしうる（#399）。
          # 配布物は release-output 直下の MSI だけ。runner 上の build では中間出力の msi\<platform>\ にも
          # 同じ MSI が残るため、再帰検索しない。
          $msiFiles = @(Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\release-output" -Filter '*.msi' -File)
          if ($msiFiles.Count -ne 1) {
            throw "release-output の MSI はちょうど 1 個である必要があります: $($msiFiles.Count) 個 ($($msiFiles.Name -join ', '))"
          }
          $msi = $msiFiles[0]

          $arguments = @{
            MsiPath = $msi.FullName
            Scenario = $env:DESKTOP_E2E_SCENARIO
            ArtifactsDirectory = "$env:GITHUB_WORKSPACE\artifacts\e2e\desktop"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:DESKTOP_E2E_EXPECTED_VERSION)) {
            $arguments.ExpectedVersion = $env:DESKTOP_E2E_EXPECTED_VERSION
          }
          & "$env:GITHUB_WORKSPACE\trusted-source\tests\e2e\scripts\Invoke-DesktopE2E.ps1" @arguments

      - name: Validate desktop E2E artifacts
        id: artifact-scan
        if: always()
        shell: pwsh
        run: |
          $directories = @(Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\artifacts\e2e\desktop" -Directory -ErrorAction SilentlyContinue)
          if ($directories.Count -eq 0) {
            throw 'desktop E2E artifact directory がありません。'
          }
          foreach ($directory in $directories) {
            & "$env:GITHUB_WORKSPACE\trusted-source\tests\e2e\scripts\Test-E2EArtifacts.ps1" -ArtifactsDirectory $directory.FullName
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          & "$env:GITHUB_WORKSPACE\trusted-source\tests\e2e\scripts\Test-E2EArtifacts.ps1" `
            -ArtifactsDirectory "$env:GITHUB_WORKSPACE\artifacts\e2e\desktop" `
            -ScanOnly
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload desktop E2E artifacts
        if: always() && steps.artifact-scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: squirrel-notifier-desktop-e2e-${{ github.run_id }}
          path: artifacts/e2e/desktop
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  cleanup-runner:
    name: Stop EC2 desktop runner
    if: ${{ always() && needs.prepare-runner.result != 'skipped' }}
    needs: [prepare-runner, desktop-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: desktop-e2e
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Keep instance state owned by another process
        if: inputs.runner_mode == 'persistent' && needs.prepare-runner.outputs.started_by_workflow != 'true'
        run: echo 'この workflow は EC2 instance を起動していないため、停止しません。'

      - name: Report no ephemeral instance
        if: inputs.runner_mode == 'ephemeral' && needs.prepare-runner.outputs.instance_id == ''
        run: echo '使い捨て instance は起動されていないため、後片付けはありません。'

      - name: Configure AWS credentials with OIDC
        if: (inputs.runner_mode == 'persistent' && needs.prepare-runner.outputs.started_by_workflow == 'true') || (inputs.runner_mode == 'ephemeral' && needs.prepare-runner.outputs.instance_id != '')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.DESKTOP_E2E_AWS_REGION }}
          role-to-assume: ${{ vars.DESKTOP_E2E_AWS_ROLE_ARN }}
          role-session-name: desktop-e2e-cleanup-${{ github.run_id }}

      - name: Create GitHub App token
        id: github-app-token
        if: inputs.runner_mode == 'ephemeral' && needs.prepare-runner.outputs.instance_id != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DESKTOP_E2E_GITHUB_APP_ID }}
          private-key: ${{ secrets.DESKTOP_E2E_GITHUB_APP_PRIVATE_KEY }}
          # job を始めなかった JIT runner の登録を削除するため。
          permission-administration: write

      - name: Checkout runner lifecycle scripts
        if: inputs.runner_mode == 'ephemeral' && needs.prepare-runner.outputs.instance_id != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: scripts/aws

      # 漏れた場合は desktop-e2e-reaper.yml が起動から 120 分で回収し、JIT parameter も有効期限で消える。
      - name: Terminate ephemeral instance
        if: inputs.runner_mode == 'ephemeral' && needs.prepare-runner.outputs.instance_id != ''
        shell: pwsh
        env:
          AWS_REGION: ${{ vars.DESKTOP_E2E_AWS_REGION }}
          INSTANCE_ID: ${{ needs.prepare-runner.outputs.instance_id }}
          GH_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          $json = ./scripts/aws/Stop-DesktopEphemeralRunner.ps1 -Repository $env:GITHUB_REPOSITORY -InstanceId $env:INSTANCE_ID -Region $env:AWS_REGION
          $json
          $result = $json | ConvertFrom-Json
          @(
            '### EC2 cleanup (ephemeral)'
            "- instance: ``$($result.instanceId)`` ($($result.instance))"
            "- JIT parameter: $($result.parameter)"
            "- runner: ``$($result.runnerName)`` ($($result.runner))"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Stop instance
        if: inputs.runner_mode == 'persistent' && needs.prepare-runner.outputs.started_by_workflow == 'true'
        shell: bash
        env:
          INSTANCE_ID: ${{ needs.prepare-runner.outputs.instance_id }}
        run: |
          set -euo pipefail

          state="$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)"
          final_state="$state"
          case "$state" in
            running)
              aws ec2 stop-instances --instance-ids "$INSTANCE_ID" >/dev/null
              aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
              final_state=stopped
              echo 'EC2 instance を停止しました。'
              ;;
            pending)
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
              aws ec2 stop-instances --instance-ids "$INSTANCE_ID" >/dev/null
              aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
              final_state=stopped
              echo '起動中だった EC2 instance を停止しました。'
              ;;
            stopping)
              aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
              final_state=stopped
              echo 'EC2 instance は既に停止処理中でした。'
              ;;
            stopped)
              echo 'EC2 instance は既に停止しています。'
              ;;
            shutting-down|terminated)
              echo "EC2 instance は停止対象外の状態です: $state"
              ;;
            *)
              echo "EC2 instance の停止に必要な状態を確認できません: $state" >&2
              exit 1
              ;;
          esac

          {
            echo '### EC2 cleanup'
            echo "- instance: \`$INSTANCE_ID\`"
            echo "- final state: \`$final_state\`"
          } >> "$GITHUB_STEP_SUMMARY"
