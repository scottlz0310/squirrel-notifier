name: PowerShell Tests

# scripts/ 配下の Pester テスト。
# - extract-release-notes.ps1: 公開 release 本文を生成する主要経路のため、版系列境界・前版選択を固定する。
# - Assert-CiChecksPassed.ps1: release の publish 前ゲート。必須ジョブの成否判定・再実行・他 App の除外を固定する（#429）。
# - Assert-ReleaseVersion.ps1 / Assert-ChangelogHasVersion.ps1: reapply-release-notes.yml と changelog-guard.yml の判定。workflow の inline では検証されないため切り出した（#384）。

# カバレッジは Codecov の powershell flag に送る（#447）。main への push でも実行するのは、
# scripts/ を変更しない PR が carryforward で引き継ぐ基準値を main 側に残すため。
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/powershell-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/powershell-tests.yml'
  workflow_dispatch:

jobs:
  pester:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Cobertura 形式のカバレッジ出力は Pester 5.6.0 以降
      - name: Ensure Pester 5.6+
        shell: pwsh
        run: |
          $p = Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.6.0' }
          if (-not $p) {
            Install-Module Pester -MinimumVersion 5.6.0 -Force -Scope CurrentUser
          }

      - name: Run Pester
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = @('./scripts')
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.CodeCoverage.Enabled = $true
          $cfg.CodeCoverage.Path = @(Get-ChildItem ./scripts -Filter *.ps1 -Recurse |
            Where-Object Name -notlike '*.Tests.ps1' | ForEach-Object FullName)
          # Cobertura はファイル名をリポジトリ相対（scripts/…）で出力するため、Codecov 側のパス補正が要らない
          $cfg.CodeCoverage.OutputFormat = 'Cobertura'
          $cfg.CodeCoverage.OutputPath = 'coverage-pester.xml'
          Invoke-Pester -Configuration $cfg

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage-pester.xml
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: powershell
