name: PowerShell Tests

# scripts/ 配下の Pester テスト。
# - extract-release-notes.ps1: 公開 release 本文を生成する主要経路のため、版系列境界・前版選択を固定する。
# - scripts/aws/DesktopRunnerHost.psm1: desktop E2E runner の自動ログオンと起動タスクの契約を固定する（#392）。
# - tests/e2e/scripts/DesktopE2EEvidence.psm1: desktop E2E の version 照合と失敗時証跡を固定する（#397）。
# - scripts/aws/DeveloperAccess.psm1: 開発者用 IAM ポリシーの権限境界を固定する（#405）。
# - scripts/aws/DesktopRunnerImage.psm1: 使い捨て runner の AMI タグと Launch Template の契約を固定する（#380）。
# - scripts/aws/DesktopE2EOidcRole.psm1: workflow の OIDC ロールの信頼条件と権限境界を固定する（#380）。
# - scripts/aws/DesktopEphemeralRunner.psm1: 使い捨て runner の名前付けと回収対象の選定を固定する（#380）。

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/e2e/scripts/**'
      - '.github/workflows/powershell-tests.yml'
  workflow_dispatch:

jobs:
  pester:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Ensure Pester v5
        shell: pwsh
        run: |
          $p = Get-Module -ListAvailable Pester | Where-Object { $_.Version.Major -ge 5 }
          if (-not $p) {
            Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser
          }

      - name: Run Pester
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = @('./scripts', './tests/e2e/scripts')
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
