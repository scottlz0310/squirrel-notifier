codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  # 80% ゲートは .NET（unittests flag）だけに掛ける。PowerShell（powershell flag）は
  # テストの無いスクリプトが多いため当面 informational とする（#447、拡充は #448）
  status:
    project:
      default:
        target: 80%
        threshold: 2%
        informational: false
        if_ci_failed: error
        flags:
          - unittests

    patch:
      default:
        target: 80%
        threshold: 5%
        informational: false
        if_ci_failed: error
        flags:
          - unittests

  ignore:
    - "**/*.g.cs"
    - "**/*.xaml.cs"
    - "**/obj/**"
    - "**/bin/**"
    - "**/*.Designer.cs"

# Pester は scripts/ を変更したときだけ実行されるため、アップロードの無いコミットでは直前の値を引き継ぐ
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: powershell
      paths:
        - scripts/
      statuses:
        - type: project
          informational: true
        - type: patch
          informational: true

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes

github_checks:
  annotations: true
